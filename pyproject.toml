[project]
name = "sinistre"
version = "0.1.0"
description = "Vérification de couverture d'un sinistre habitation à partir des conditions générales, avec citations vérifiées."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pydantic>=2.7",
  "openai>=1.40",
  "anthropic>=0.40",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-dotenv>=1",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sinistre-build = "sinistre.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinistre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
